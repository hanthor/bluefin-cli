name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Superseded runs waste the queue; only the newest per ref matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        
    - name: Download dependencies
      run: go mod download

    - name: Build binary for integration tests
      run: go build -o bluefin-cli .

    - name: Run unit tests
      run: go test -tags extra -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  tui-smoke:
    name: TUI Smoke (tmux)
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Install tmux
      run: sudo apt-get update && sudo apt-get install -y tmux

    - name: Build binary
      run: go build -tags extra -o bluefin-cli-smoke .

    - name: Run smoke suite
      run: ./scripts/tui-smoke.sh ./bluefin-cli-smoke

    - name: Run TUI state suite
      run: ./scripts/tui-state.sh ./bluefin-cli-smoke

  cross-compile:
    name: Cross-compile (all targets)
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build every release target, both variants
      run: |
        set -e
        for goos in linux darwin windows; do
          for goarch in amd64 arm64; do
            echo "== $goos/$goarch"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build ./...
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -tags extra ./...
          done
        done

  test-windows:
    name: Run Tests (windows)
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build binary for integration tests
      run: go build -tags extra -o bluefin-cli.exe .

    - name: Run unit tests
      run: go test -tags extra ./...

  test-macos:
    name: Run Tests (macos)
    runs-on: blacksmith-6vcpu-macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build binary for integration tests
      run: go build -tags extra -o bluefin-cli .

    - name: Run unit tests
      run: go test -tags extra ./...

  goreleaser-check:
    name: goreleaser config
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        version: '~> v2'
        install-only: true

    # Deprecation warnings (brews) are accepted; hard config errors fail.
    - name: Check config
      run: |
        out=$(goreleaser check 2>&1) && exit 0
        echo "$out"
        echo "$out" | grep -q "valid, but uses deprecated" && exit 0
        exit 1

  gofmt:
    name: gofmt
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Check formatting
      run: |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "gofmt needed on:"; echo "$out"; exit 1
        fi

  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
